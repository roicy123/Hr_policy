services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
      - ./vectorstore:/app/vectorstore
      - hf_cache:/root/.cache/huggingface   # avoids re-downloading the embedding model

  ui:
    build: .
    command: streamlit run ui/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      - API_URL=http://api:8000/chat
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  hf_cache: